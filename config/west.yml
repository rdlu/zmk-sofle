manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # eyelash_sofle board/shield module — pinned to the "adapt to dyastudio"
    # commit (#98), which provides boards/shields/eyelash_sofle/ + per-side
    # studio confs. Pinned (not `main`) for reproducible builds.
    - name: eyelash_sofle
      url: https://github.com/a741725193/zmk-sofle
      revision: 4848e21f8c42b99adc05eeb699fb02c91146dca8
    # cormoran's ZMK fork (v0.3 base) — adds DYA Studio BLE keymap editing.
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    # DYA Studio support modules (cormoran). All pinned to SHAs/tags: these
    # three used to track `main`, so CI (fresh `west update` every run) and a
    # local workspace could build different module source. SHAs below captured
    # 2026-08-29 from each repo's `main` HEAD.
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: 8b1125ed676c1f5e14145d217984f33d0ebdcef4
    - name: zmk-module-ble-management
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: 78f86df9e6c5edaf57bef3ccbd7f360cfdf49291
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.3.0.0
  self:
    path: config
